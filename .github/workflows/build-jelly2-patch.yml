name: Build Jelly2 patched APK

on:
  push:
    branches:
      - jelly2-serial-race-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install required Android SDK and NDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;30.0.3" "ndk;21.3.6528147"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.3.6528147" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.3.6528147" >> "$GITHUB_ENV"

      - name: Set up Java 11 for Gradle and AGP
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build debug APK
        working-directory: ./app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: octo4a-jelly2-serial-race-fix
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
