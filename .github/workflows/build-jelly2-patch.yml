name: Build Jelly2 patched APK

on:
  push:
    branches:
      - jelly2-serial-race-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21d
        run: sdkmanager "ndk;21.3.6528147"

      - name: Build debug APK
        working-directory: ./app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: octo4a-jelly2-serial-race-fix
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
